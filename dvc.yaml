stages:
  data_cleaning:
    cmd: uv run python src/data_cleaning.py
    deps:
      - data/Music Info.csv
      - src/data_cleaning.py
      - src/hybrid_recommender_system/utils/logger.py
    outs:
      - data/cleaned_data.csv

  transform_data:
    cmd: uv run python src/content_based_filtering.py
    deps:
      - data/cleaned_data.csv
      - src/content_based_filtering.py
      - src/data_cleaning.py
      - src/hybrid_recommender_system/utils/logger.py
    outs:
      - data/transformed_data.npz
      - transformer.joblib

  interaction_data:
    cmd: uv run python src/collaborative_filtering.py
    deps:
      - data/User Listening History.csv
      - src/collaborative_filtering.py
      - src/data_cleaning.py
      - src/hybrid_recommender_system/utils/logger.py
    outs:
      - data/track_ids.npy
      - data/collab_filtered_data.csv
      - data/interaction_matrix.npz